<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Set a new password for your Prepify account.">
  <title>Reset Password | Prepify</title>
  <link rel="stylesheet" href="css/base.css"><link rel="stylesheet" href="css/layout.css"><link rel="stylesheet" href="css/components.css"><link rel="stylesheet" href="css/auth.css"><link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <main class="auth-page"><section class="auth-card">
    <a href="index.html" class="brand auth-brand">Prepify<span>.</span></a>
    <div class="auth-heading"><h1>Create a new password</h1><p>Choose a strong password you haven't used before.</p></div>
    <form id="reset-password-form">
      <div class="form-group"><label for="new-password">New password</label><input type="password" id="new-password" autocomplete="new-password" minlength="8" maxlength="72" required></div>
      <div class="form-group"><label for="confirm-password">Confirm new password</label><input type="password" id="confirm-password" autocomplete="new-password" minlength="8" maxlength="72" required></div>
      <p id="reset-message" class="auth-feedback" role="status" aria-live="polite" hidden></p>
      <button type="submit" class="btn btn-primary auth-submit">Reset password</button>
    </form>
    <p class="auth-switch"><a href="login.html">← Back to login</a></p>
  </section></main>
  <script src="js/api.js"></script><script src="js/reset-password.js"></script>
</body>
</html>
