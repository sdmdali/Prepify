
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Log in to Prepify and continue preparing smarter.">
    <title>Login | Prepify</title>

    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

    <main class="auth-page">
        <section class="auth-card">

            <a href="index.html" class="brand auth-brand">
                Prepify<span>.</span>
            </a>

            <div class="auth-heading">
                <h1>Welcome back!</h1>
                <p>Log in to continue your preparation.</p>
            </div>

            <form id="login-form">

                <div class="form-group">
                    <label for="email">Email address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <div class="auth-options">
                    <label class="remember-option">
                        <input type="checkbox" id="remember-me">
                        Remember me
                    </label>

                    <a href="forgot-password.html" id="forgot-password">Forgot password?</a>
                </div>

                <button type="submit" class="btn btn-primary auth-submit">
                    Log in
                </button>

            </form>

            <p class="auth-switch">
                Don't have an account?
                <a href="signup.html">Create one</a>
            </p>

            <a href="index.html" class="back-home">
                ← Back to home
            </a>

        </section>
    </main>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
