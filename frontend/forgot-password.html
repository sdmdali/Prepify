<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Request a secure Prepify password reset link.">
  <title>Forgot Password | Prepify</title>
  <link rel="stylesheet" href="css/base.css"><link rel="stylesheet" href="css/layout.css"><link rel="stylesheet" href="css/components.css"><link rel="stylesheet" href="css/auth.css"><link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <main class="auth-page"><section class="auth-card">
    <a href="index.html" class="brand auth-brand">Prepify<span>.</span></a>
    <div class="auth-heading"><h1>Forgot password?</h1><p>Enter the email address associated with your account. We'll send you a reset link.</p></div>
    <form id="forgot-password-form">
      <div class="form-group"><label for="reset-email">Email address</label><input type="email" id="reset-email" name="email" placeholder="you@example.com" autocomplete="email" maxlength="190" required></div>
      <p id="reset-message" class="auth-feedback" role="status" aria-live="polite" hidden></p>
      <button type="submit" class="btn btn-primary auth-submit">Send reset link</button>
    </form>
    <p class="auth-switch"><a href="login.html">← Back to login</a></p>
  </section></main>
  <script src="js/api.js"></script><script src="js/forgot-password.js"></script>
</body>
</html>
